<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅の割り勘精算</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4f3;--card:#fff;--text:#1d2b2a;--sub:#5f7472;--line:#d5e2e0;--input:#f6faf9;--res:#12403f;--resfg:#fff;--gold:#ffd166;--b:#e8743b;--accent:#0e8c86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a19;--card:#182827;--text:#e6f0ef;--sub:#93aaa8;--line:#2a3f3d;--input:#0f1a19;--res:#0a2c2b;--b:#ff9a62;--accent:#34c3bb}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.inp{background:var(--input);border:1px solid var(--line);border-radius:12px;color:var(--text);width:100%;padding:12px;font-size:16px}
.inp:focus,button:focus-visible{outline:3px solid var(--res);outline-offset:1px}
.sub{color:var(--sub)}
.pick{border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700;background:var(--input);color:var(--text);font-size:14px}
.pick.on{background:var(--res);border-color:var(--res);color:#fff}
</style>
</head>
<body>
<main class="max-w-md mx-auto px-4 py-5 space-y-4">
  <h1 class="text-xl font-black">旅の割り勘精算</h1>

  <section aria-live="polite" class="rounded-3xl p-5 shadow-lg" style="background:var(--res);color:var(--resfg)">
    <p class="text-sm opacity-80">現在の総額</p>
    <p id="total" class="text-4xl font-black">0円</p>
    <div id="sums" class="grid grid-cols-2 gap-2 mt-4 text-sm"></div>
    <div class="mt-4 rounded-2xl p-4" style="background:var(--gold);color:#3a2a00">
      <p class="text-xs font-bold text-center">精算結果</p>
      <ul id="settle" class="mt-1 space-y-1 text-center font-black"></ul>
    </div>
  </section>

  <section class="card p-4 space-y-3">
    <h2 class="font-bold">支払いを追加</h2>
    <input id="memo" class="inp" type="text" placeholder="品名・メモ（例：レンタカー代）" maxlength="40">
    <input id="amount" class="inp" type="number" inputmode="numeric" min="1" placeholder="金額（円）">
    <div>
      <p class="text-sm sub mb-1">支払った人</p>
      <div id="picker" class="grid grid-cols-2 gap-2"></div>
    </div>
    <p id="err" class="text-sm font-bold" style="color:var(--b)" role="alert"></p>
    <button type="button" id="add" class="w-full rounded-xl py-3 font-black text-white text-lg" style="background:var(--res)">追加する</button>
  </section>

  <section class="card p-4">
    <h2 class="font-bold mb-2">履歴 <span id="count" class="sub text-sm font-normal"></span></h2>
    <ul id="list" class="divide-y" style="--tw-divide-opacity:1"></ul>
    <p id="empty" class="sub text-sm py-4 text-center">まだ支払いがありません。上のフォームから追加してください。</p>
  </section>

  <section class="card p-4 space-y-3">
    <h2 class="font-bold">参加メンバー</h2>
    <ul id="members" class="space-y-2"></ul>
    <button type="button" id="addMember" class="w-full rounded-xl py-2 font-bold border-2" style="border-color:var(--accent);color:var(--accent)">+ メンバーを追加</button>
    <p class="text-xs sub">最少2人まで。削除すると、その人の履歴も一緒に消えます。</p>
  </section>

  <button type="button" id="reset" class="w-full rounded-xl py-3 font-bold border-2" style="border-color:var(--b);color:var(--b)">すべてのデータをリセット</button>
</main>

<script>
const KEY='warikan-v2';
let S={names:['1','2'],items:[],who:0};
try{
  const r=localStorage.getItem(KEY);
  if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.items)&&Array.isArray(p.names)&&p.names.length>=2)S={names:p.names,items:p.items,who:0}}
  else{
    const old=localStorage.getItem('warikan-v1');
    if(old){const p=JSON.parse(old);if(p&&Array.isArray(p.items)&&Array.isArray(p.names))S={names:p.names,items:p.items,who:0}}
  }
}catch(e){}

const $=id=>document.getElementById(id);
const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
const nm=i=>(S.names[i]&&S.names[i].trim())||`${i+1}`;
function save(){try{localStorage.setItem(KEY,JSON.stringify({names:S.names,items:S.items}))}catch(e){}}

function render(){renderTop();renderMembers();}

function renderTop(){
  const n=S.names.length;
  const sum=new Array(n).fill(0);
  S.items.forEach(x=>{if(x.who<n)sum[x.who]+=x.amount});
  const total=sum.reduce((a,b)=>a+b,0);
  const share=total/n;
  $('total').textContent=yen(total);

  const sumsEl=$('sums');sumsEl.textContent='';
  sum.forEach((v,i)=>{
    const d=document.createElement('div');d.className='rounded-xl p-3';d.style.background='rgba(255,255,255,.1)';
    d.innerHTML=`<p class="opacity-80 truncate">${nm(i)}の立替合計</p><p class="text-lg font-bold">${yen(v)}</p>`;
    sumsEl.append(d);
  });

  const settleEl=$('settle');settleEl.textContent='';
  if(total===0){
    const li=document.createElement('li');li.textContent='まだ支払いがありません';settleEl.append(li);
  }else{
    const diff=sum.map(v=>v-share);
    const debtors=diff.map((v,i)=>({i,v})).filter(x=>x.v<-0.5).sort((a,b)=>a.v-b.v);
    const creditors=diff.map((v,i)=>({i,v})).filter(x=>x.v>0.5).sort((a,b)=>b.v-a.v);
    let di=0,ci=0;const txns=[];
    while(di<debtors.length&&ci<creditors.length){
      const d=debtors[di],c=creditors[ci];
      const amt=Math.min(-d.v,c.v);
      if(amt>=1)txns.push({from:d.i,to:c.i,amt});
      d.v+=amt;c.v-=amt;
      if(Math.abs(d.v)<1)di++;
      if(Math.abs(c.v)<1)ci++;
    }
    if(txns.length===0){const li=document.createElement('li');li.textContent='精算なし（ぴったり均等です）';settleEl.append(li)}
    txns.forEach(t=>{
      const li=document.createElement('li');
      li.textContent=`【 ${nm(t.from)} 】が【 ${nm(t.to)} 】に 【 ${yen(t.amt)} 】支払う`;
      settleEl.append(li);
    });
  }

  const picker=$('picker');picker.textContent='';
  S.names.forEach((name,i)=>{
    const b=document.createElement('button');b.type='button';b.textContent=nm(i);
    b.className='pick'+(S.who===i?' on':'');b.setAttribute('aria-pressed',S.who===i);
    b.onclick=()=>{S.who=i;render()};
    picker.append(b);
  });

  const ul=$('list');ul.textContent='';
  S.items.slice().reverse().forEach(x=>{
    const li=document.createElement('li');li.className='flex items-center gap-3 py-3';li.style.borderColor='var(--line)';
    const mid=document.createElement('div');mid.className='flex-1 min-w-0';
    const t=document.createElement('p');t.className='font-bold truncate';t.textContent=x.memo||'（メモなし）';
    const s=document.createElement('p');s.className='text-xs sub';s.textContent=nm(x.who)+'が立替';
    mid.append(t,s);
    const a=document.createElement('span');a.className='font-black whitespace-nowrap';a.textContent=yen(x.amount);
    const d=document.createElement('button');d.type='button';d.setAttribute('aria-label',(x.memo||'この項目')+'を削除');d.className='p-2 rounded-lg sub';
    d.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
    d.onclick=()=>{S.items=S.items.filter(i=>i.id!==x.id);save();render()};
    li.append(mid,a,d);ul.append(li);
  });
  $('empty').style.display=S.items.length?'none':'block';
  $('count').textContent=S.items.length?`（${S.items.length}件）`:'';
}

function renderMembers(){
  const mem=$('members');mem.textContent='';
  S.names.forEach((name,i)=>{
    const li=document.createElement('li');li.className='flex items-center gap-2';
    const inp=document.createElement('input');inp.className='inp';inp.value=name;inp.maxLength=10;
    inp.oninput=e=>{S.names[i]=e.target.value;save();renderTop()};
    inp.onblur=e=>{if(!e.target.value.trim()){S.names[i]=`${i+1}`;save();render()}};
    li.append(inp);
    if(S.names.length>2){
      const del=document.createElement('button');del.type='button';del.className='p-2 sub';del.setAttribute('aria-label',(name||(i+1))+'を削除');
      del.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
      del.onclick=()=>{
        S.items=S.items.filter(x=>x.who!==i).map(x=>x.who>i?{...x,who:x.who-1}:x);
        S.names.splice(i,1);
        if(S.who===i)S.who=0;else if(S.who>i)S.who--;
        save();render();
      };
      li.append(del);
    }
    mem.append(li);
  });
}

$('add').onclick=()=>{
  const amount=Math.round(Number($('amount').value));
  if(!amount||amount<=0){$('err').textContent='金額を1円以上で入力してください。';$('amount').focus();return}
  $('err').textContent='';
  S.items.push({id:Date.now()+Math.random(),memo:$('memo').value.trim(),amount,who:S.who});
  $('memo').value='';$('amount').value='';$('memo').focus();save();render();
};
$('addMember').onclick=()=>{
  if(S.names.length>=10){alert('メンバーは最大10人までです。');return}
  S.names.push(`${S.names.length+1}`);save();render();
};
let armed=false,tm;
function disarm(){armed=false;clearTimeout(tm);$('reset').textContent='すべてのデータをリセット';$('reset').style.background='transparent';$('reset').style.color='var(--b)'}
$('reset').onclick=()=>{
  if(!S.items.length&&S.names.length===2&&S.names[0]==='1'&&S.names[1]==='2')return;
  if(!armed){
    armed=true;
    $('reset').textContent='もう一度タップで全削除（元に戻せません）';
    $('reset').style.background='var(--b)';$('reset').style.color='#fff';
    tm=setTimeout(disarm,4000);
    return;
  }
  disarm();S={names:['1','2'],items:[],who:0};save();render();
};
render();
</script>
</body>
</html>
